  function zoneColor(p) {
    if (p < LOW_MAX) return "#2e7d4f";
    if (p > HIGH_MIN) return "#b3413d";
    return "#c9962c";
  }

  async function buildChart() {
    let points = HISTORY.map(pt => ({ t: new Date(pt.d + "T00:00:00Z").getTime(), p: pt.p }));

    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=BNO&token=${API_KEY}`);
      const data = await res.json();
      if (data && data.c) {
        points.push({ t: Date.now(), p: data.c });
      }
    } catch (e) { /* fall back to historical data only */ }

    const W = 900, H = 420, PAD_L = 46, PAD_R = 16, PAD_T = 16, PAD_B = 30;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const prices = points.map(pt => pt.p);
    const yMin = Math.floor(Math.min(...prices, LOW_MAX) / 5) * 5 - 5;
    const yMax = Math.ceil(Math.max(...prices, HIGH_MIN) / 5) * 5 + 5;

    function x(t) { return PAD_L + ((t - t0) / (t1 - t0)) * (W - PAD_L - PAD_R); }
    function y(p) { return H - PAD_B - ((p - yMin) / (yMax - yMin)) * (H - PAD_T - PAD_B); }

    const yLow = y(LOW_MAX), yHigh = y(HIGH_MIN);

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

    svg += `<rect x="${PAD_L}" y="${PAD_T}" width="${W-PAD_L-PAD_R}" height="${yHigh-PAD_T}" fill="#b3413d" opacity="0.12"/>`;
    svg += `<rect x="${PAD_L}" y="${yHigh}" width="${W-PAD_L-PAD_R}" height="${yLow-yHigh}" fill="#c9962c" opacity="0.12"/>`;
    svg += `<rect x="${PAD_L}" y="${yLow}" width="${W-PAD_L-PAD_R}" height="${H-PAD_B-yLow}" fill="#2e7d4f" opacity="0.12"/>`;

    svg += `<line x1="${PAD_L}" y1="${yLow}" x2="${W-PAD_R}" y2="${yLow}" stroke="rgba(255,255,255,0.25)" stroke-dasharray="4 4"/>`;
    svg += `<line x1="${PAD_L}" y1="${yHigh}" x2="${W-PAD_R}" y2="${yHigh}" stroke="rgba(255,255,255,0.25)" stroke-dasharray="4 4"/>`;
    svg += `<text x="${PAD_L+4}" y="${yLow-4}" fill="rgba(255,255,255,0.4)" font-size="10" font-family="monospace">$49</text>`;
    svg += `<text x="${PAD_L+4}" y="${yHigh-4}" fill="rgba(255,255,255,0.4)" font-size="10" font-family="monospace">$55</text>`;

    let path = "";
    points.forEach((pt, i) => {
      const cmd = i === 0 ? "M" : "L";
      path += `${cmd}${x(pt.t).toFixed(1)},${y(pt.p).toFixed(1)} `;
    });
    svg += `<path d="${path}" fill="none" stroke="#fff" stroke-width="1.5"/>`;

    points.forEach((pt, i) => {
      if (i % 3 !== 0 && i !== points.length - 1) return;
      svg += `<circle cx="${x(pt.t).toFixed(1)}" cy="${y(pt.p).toFixed(1)}" r="1.8" fill="${zoneColor(pt.p)}"/>`;
    });

    const last = points[points.length - 1];
    svg += `<circle cx="${x(last.t).toFixed(1)}" cy="${y(last.p).toFixed(1)}" r="5" fill="${zoneColor(last.p)}" stroke="#1a1a1a" stroke-width="1.5"/>`;

    const months = [];
    let cursor = new Date(Date.UTC(new Date(t0).getUTCFullYear(), new Date(t0).getUTCMonth(), 1));
    const end = new Date(t1);
    while (cursor <= end) {
      months.push(new Date(cursor));
      cursor = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth() + 1, 1));
    }
    months.forEach(m => {
      const mx = x(m.getTime());
      if (mx >= PAD_L && mx <= W - PAD_R) {
        const label = m.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
        svg += `<text x="${mx.toFixed(1)}" y="${H-10}" fill="rgba(255,255,255,0.4)" font-size="9" font-family="monospace" text-anchor="middle">${label}</text>`;
      }
    });

    svg += `</svg>`;
    document.getElementById("chart-wrap").innerHTML = svg;
    document.getElementById("note").textContent =
      "Daily close data, Jun 23 2025 – Aug 24 2026; the final point updates live.";
  }

  buildChart();
</script>
