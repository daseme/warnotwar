<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dean Street Heuristic</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    background: #1a1a1a;
    color: #fff;
  }
  .wrap {
    text-align: center;
    padding: 40px 20px;
    max-width: 500px;
  }
  h1 {
    font-size: 1.6em;
    font-weight: normal;
    letter-spacing: 0.03em;
    margin-bottom: 1.2em;
  }
  p {
    font-size: 1.2em;
    line-height: 2em;
    margin: 0;
  }
  #price {
    margin-top: 2em;
    font-family: monospace;
    font-size: 14px;
    color: rgba(255,255,255,0.5);
  }
  a.back {
    display: inline-block;
    margin-top: 2em;
    color: rgba(255,255,255,0.5);
    font-family: monospace;
    font-size: 13px;
    text-decoration: none;
  }
  a.back:hover { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Dean Street Heuristic</h1>
  <p>
    &lt; 49 = peace<br>
    &gt; 55 = war<br>
    50 = perpetual war sweet spot
  </p>
  <div id="price"></div>
  <a class="back" href="/">&larr; back</a>
</div>

<script>
  const TICKER = "BNO";
  const API_KEY = "da68rdhr01qtngrev8kgda68rdhr01qtngrev8l0";

  async function fetchPrice() {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${TICKER}&token=${API_KEY}`);
      const data = await res.json();
      const price = data.c;
      if (!price) throw new Error("no price");
      document.getElementById("price").textContent =
        `${TICKER} $${price.toFixed(2)} — updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
      document.getElementById("price").textContent = "Error fetching price.";
    }
  }

  fetchPrice();
</script>
</body>
</html>
