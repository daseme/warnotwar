<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dean Street Heuristic</title>
<meta name="description" content="BNO, an oil fund that tracks Brent crude: under $49 peace, over $55 war, 50 the perpetual war sweet spot.">
<meta property="og:title" content="The Dean Street Heuristic">
<meta property="og:description" content="Under $49 peace. Over $55 war. 50, the perpetual war sweet spot. Live BNO reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Playfair Display', Georgia, serif;
    background: #0f0f11;
    color: #e8e6e3;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 28px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 2.2em;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 0.3em;
    text-align: center;
    color: #f0ece6;
  }
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75em;
    color: rgba(240,236,230,0.35);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.2em;
  }

  .rules {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 0 1.3em;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72em;
    letter-spacing: 0.02em;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .rule-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .rule-peace { color: #3d9f6b; }
  .rule-peace .rule-dot { background: #3d9f6b; }
  .rule-sweet { color: #d4a843; }
  .rule-sweet .rule-dot { background: #d4a843; }
  .rule-war { color: #c94e4e; }
  .rule-war .rule-dot { background: #c94e4e; }

  #live-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: rgba(240,236,230,0.45);
    margin-bottom: 1.2em;
  }
  #live-price {
    font-size: 1.4em;
    font-weight: 500;
    color: #f0ece6;
  }
  .live-pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3d9f6b;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  #chart-wrap {
    width: 100%;
    max-width: 900px;
    margin-top: 0.7em;
    background: rgba(255,255,255,0.015);
    border-radius: 12px;
    padding: 14px 12px 10px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  svg { width: 100%; height: auto; display: block; }

  .legend {
    display: flex; gap: 18px; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    color: rgba(240,236,230,0.45);
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .note {
    max-width: 620px;
    font-size: 11px;
    color: rgba(240,236,230,0.28);
    text-align: center;
    margin-top: 10px;
    line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
  }

  .backrow {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1.4em;
  }
  a.back {
    display: inline-block;
    color: rgba(240,236,230,0.35);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color 0.2s;
  }
  a.back:hover { color: rgba(240,236,230,0.7); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.75em;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<h1>The Dean Street Heuristic</h1>
<div class="subtitle">BNO &middot; an oil fund that tracks Brent crude</div>

<div id="live-bar">
  <span class="live-pulse"></span>
  <span id="price">Loading…</span>
</div>

<div class="rules">
  <div class="rule rule-peace"><span class="rule-dot"></span>&lt; 49 peace</div>
  <div class="rule rule-sweet"><span class="rule-dot"></span>50 perpetual war sweet spot</div>
  <div class="rule rule-war"><span class="rule-dot"></span>&gt; 55 war</div>
</div>

<div id="chart-wrap"></div>

<div class="legend">
  <span><span class="dot" style="background:#3d9f6b;box-shadow:0 0 6px #3d9f6b"></span>peace (&lt; 49)</span>
  <span><span class="dot" style="background:#d4a843;box-shadow:0 0 6px #d4a843"></span>sweet spot (49–55)</span>
  <span><span class="dot" style="background:#c94e4e;box-shadow:0 0 6px #c94e4e"></span>war (&gt; 55)</span>
  <span><span style="width:3px;height:10px;background:#c94e4e;display:inline-block;opacity:0.7"></span>intraday war touch · wider = more days in a row</span>
</div>

<div class="note" id="note">Loading price history…</div>

<div class="backrow">
  <a class="back" href="/oilflows.html">?</a>
  <a class="back" href="/lab.html">reading the hormuz numbers</a>
  <a class="back" href="/">&larr; back</a>
</div>

<script>
  const TICKER = "BNO";
  const LOW_MAX = 49;
  const HIGH_MIN = 55;
  const API_KEY = "da68rdhr01qtngrev8kgda68rdhr01qtngrev8l0";

  function zoneColor(p) {
    if (p < LOW_MAX) return "#3d9f6b";
    if (p > HIGH_MIN) return "#c94e4e";
    return "#d4a843";
  }
  function zoneName(p) {
    if (p < LOW_MAX) return "peace";
    if (p > HIGH_MIN) return "war";
    return "sweet spot";
  }

  async function fetchLive() {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${TICKER}&token=${API_KEY}`);
      const data = await res.json();
      if (data && data.c) return { c: data.c, h: data.h, t: data.t };
    } catch (e) {}
    return null;
  }

  // straight segments: the line only ever passes through actual closes
  function linePath(points, xFn, yFn) {
    return points.map((pt, i) =>
      `${i === 0 ? "M" : "L"}${xFn(pt).toFixed(1)},${yFn(pt).toFixed(1)}`).join(" ");
  }

  async function buildChart(history, live) {
    let points = history.map(pt => ({ t: new Date(pt.d + "T00:00:00Z").getTime(), p: pt.p, h: pt.h }));
    if (live) points.push({ t: Date.now(), p: live.c, h: live.h });

    const W = 960, H = 420, PAD_L = 52, PAD_R = 20, PAD_T = 24, PAD_B = 36;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const prices = points.map(pt => pt.p);
    const yMin = Math.floor(Math.min(...prices, LOW_MAX) / 5) * 5 - 5;
    const yMax = Math.ceil(Math.max(...prices, HIGH_MIN) / 5) * 5 + 5;
    const baselineY = H - PAD_B;

    function x(t) { return PAD_L + ((t - t0) / (t1 - t0)) * (W - PAD_L - PAD_R); }
    function y(p) { return H - PAD_B - ((p - yMin) / (yMax - yMin)) * (H - PAD_T - PAD_B); }
    // smoothPath/buildAreaPath take whole points; adapt to the raw scales
    const px = pt => x(pt.t), py = pt => y(pt.p);

    const yLow = y(LOW_MAX), yHigh = y(HIGH_MIN);

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

    svg += `<rect x="${PAD_L}" y="${PAD_T}" width="${W-PAD_L-PAD_R}" height="${yHigh-PAD_T}" fill="#c94e4e" opacity="0.12"/>`;
    svg += `<rect x="${PAD_L}" y="${yHigh}" width="${W-PAD_L-PAD_R}" height="${yLow-yHigh}" fill="#d4a843" opacity="0.12"/>`;
    svg += `<rect x="${PAD_L}" y="${yLow}" width="${W-PAD_L-PAD_R}" height="${H-PAD_B-yLow}" fill="#3d9f6b" opacity="0.12"/>`;

    for (let p = Math.ceil(yMin / 5) * 5; p <= yMax; p += 5) {
      const gy = y(p);
      const isZoneLine = (p === LOW_MAX || p === HIGH_MIN);
      svg += `<line x1="${PAD_L}" y1="${gy.toFixed(1)}" x2="${W-PAD_R}" y2="${gy.toFixed(1)}" stroke="rgba(240,236,230,${isZoneLine ? 0.18 : 0.06})" stroke-dasharray="${isZoneLine ? "6 4" : "2 4"}" stroke-width="${isZoneLine ? 1.2 : 0.8}"/>`;
      if (!isZoneLine) {
        svg += `<text x="${PAD_L - 8}" y="${gy + 3}" fill="rgba(240,236,230,0.2)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">$${p}</text>`;
      }
    }

    svg += `<text x="${PAD_L + 6}" y="${yLow - 6}" fill="#3d9f6b" font-size="10" font-family="JetBrains Mono, monospace" font-weight="500" opacity="0.8">$49</text>`;
    svg += `<text x="${PAD_L + 6}" y="${yHigh - 6}" fill="#c94e4e" font-size="10" font-family="JetBrains Mono, monospace" font-weight="500" opacity="0.8">$55</text>`;

    let runs = [];
    let currentZone = zoneColor(points[0].p);
    let runStart = 0;
    for (let i = 1; i < points.length; i++) {
      const z = zoneColor(points[i].p);
      if (z !== currentZone) {
        runs.push({ zone: currentZone, start: runStart, end: i - 1 });
        currentZone = z;
        runStart = i - 1;
      }
    }
    runs.push({ zone: currentZone, start: runStart, end: points.length - 1 });

    runs.forEach(run => {
      const runPoints = points.slice(run.start, run.end + 1);
      const lineD = linePath(runPoints, px, py);
      svg += `<path d="${lineD}" fill="none" stroke="${run.zone}" stroke-width="1.5" stroke-linejoin="round"/>`;
    });

    const touches = points.map(pt => pt.h > HIGH_MIN && pt.p <= HIGH_MIN);
    for (let i = 0; i < points.length; i++) {
      if (!touches[i]) continue;
      let j = i;
      while (j + 1 < points.length && touches[j + 1]) j++;
      const n = j - i + 1;
      const cx = (x(points[i].t) + x(points[j].t)) / 2;
      const w = Math.min(2 + (n - 1) * 2.2, 10);
      svg += `<rect x="${(cx - w / 2).toFixed(1)}" y="${PAD_T}" width="${w.toFixed(1)}" height="${H - PAD_B - PAD_T}" fill="#c94e4e" opacity="0.35" rx="1"/>`;
      i = j;
    }

    points.forEach((pt, i) => {
      if (i % 3 !== 0 && i !== points.length - 1) return;
      const cx = x(pt.t), cy = y(pt.p);
      const zc = zoneColor(pt.p);
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="${zc}" opacity="0.6"/>`;
    });

    const last = points[points.length - 1];
    const lastX = x(last.t), lastY = y(last.p);
    const lastZc = zoneColor(last.p);
    svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="5" fill="${lastZc}" stroke="#0f0f11" stroke-width="2.5"/>`;
    svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="9" fill="none" stroke="${lastZc}" stroke-width="1" opacity="0.4"/>`;

    const months = [];
    let cursor = new Date(Date.UTC(new Date(t0).getUTCFullYear(), new Date(t0).getUTCMonth(), 1));
    const end = new Date(t1);
    while (cursor <= end) {
      months.push(new Date(cursor));
      cursor = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth() + 1, 1));
    }
    months.forEach(m => {
      const mx = x(m.getTime());
      if (mx >= PAD_L && mx <= W - PAD_R) {
        const label = m.toLocaleDateString(undefined, { month: "short", year: "2-digit" });
        svg += `<text x="${mx.toFixed(1)}" y="${H-10}" fill="rgba(240,236,230,0.3)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="middle">${label}</text>`;
      }
    });

    svg += `</svg>`;
    document.getElementById("chart-wrap").innerHTML = svg;

    const zone = zoneName(last.p);
    const zoneColorVal = zoneColor(last.p);
    document.getElementById("note").innerHTML =
      `Daily closes, Jun 23 2025 – present — roughly since Operation Midnight Hammer. The final point updates live.<br>` +
      `Currently: <span style="color:${zoneColorVal};font-weight:500">${zone}</span>`;
  }

  async function init() {
    const [historyRes, live] = await Promise.all([
      fetch("/history.json"),
      fetchLive()
    ]);
    const history = await historyRes.json();

    const pulse = document.querySelector(".live-pulse");
    if (live) {
      const zc = zoneColor(live.c);
      const zn = zoneName(live.c);
      if (pulse) pulse.style.background = zc;
      // finnhub's t = time of the last trade, shown in the viewer's own
      // timezone; outside market hours this honestly reads as stale
      let when = "";
      if (live.t) {
        const tr = new Date(live.t * 1000);
        const sameDay = tr.toDateString() === new Date().toDateString();
        when = sameDay
          ? tr.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : tr.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }
      document.getElementById("price").innerHTML =
        `<span id="live-price" style="color:${zc}">$${live.c.toFixed(2)}</span> ` +
        `<span class="status-badge" style="background:${zc}15;color:${zc};border:1px solid ${zc}30">${zn}</span> ` +
        (when ? `<span style="opacity:0.5">last trade ${when}</span>` : "");
    } else {
      if (pulse) pulse.style.background = "rgba(240,236,230,0.3)";
      document.getElementById("price").innerHTML = `<span style="color:#c94e4e">Error fetching live price</span>`;
    }

    buildChart(history, live);
  }

  init();
</script>

</body>
</html>
