<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dean Street Heuristic</title>
<meta name="description" content="BNO, an oil fund that tracks Brent crude: under $49 peace, over $55 war, 50 the perpetual war sweet spot.">
<meta property="og:title" content="The Dean Street Heuristic">
<meta property="og:description" content="Under $49 peace. Over $55 war. 50, the perpetual war sweet spot. Live BNO reading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Playfair Display', Georgia, serif;
    background: #0f0f11;
    color: #e8e6e3;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 44px 20px 40px;
    box-sizing: border-box;
  }
  .sheet { width: 100%; max-width: 900px; }
  .toprule { border-top: 1px solid rgba(240,236,230,0.35); padding-top: 18px; text-align: center; }
  h1 {
    font-size: 1.9em;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    color: #f0ece6;
  }
  .deck {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(240,236,230,0.55);
    line-height: 1.7;
    margin: 0 auto 4px;
  }
  .deck .z-peace { color: #3d9f6b; }
  .deck .z-sweet { color: #d4a843; }
  .deck .z-war { color: #c94e4e; }
  #live-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: rgba(240,236,230,0.45);
    margin: 14px 0 6px;
  }
  #live-price { font-size: 1.4em; font-weight: 500; }
  .live-pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3d9f6b;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .status-badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 4px;
    font-size: 0.75em; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  svg { width: 100%; height: auto; display: block; }
  .source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(240,236,230,0.28);
    line-height: 1.7;
    margin-top: 8px;
  }
  .backrow {
    display: flex; gap: 32px; flex-wrap: wrap;
    justify-content: center;
    margin-top: 2.2em;
  }
  a.back {
    color: rgba(240,236,230,0.35);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; text-decoration: none;
    letter-spacing: 0.03em; transition: color 0.2s;
  }
  a.back:hover { color: rgba(240,236,230,0.7); }
</style>
</head>
<body>

<div class="sheet">
  <div class="toprule">
    <h1>The Dean Street Heuristic</h1>
    <p class="deck">BNO, an oil fund that tracks Brent crude.<br>
      <span class="z-peace">Under $49, peace.</span>
      <span class="z-war">Over $55, war.</span>
      <span class="z-sweet">50, the perpetual war sweet spot.</span></p>
  </div>

  <div id="live-bar">
    <span class="live-pulse"></span>
    <span id="price">Loading…</span>
  </div>

  <div id="chart-wrap"></div>

  <div class="source" id="note">Loading price history…</div>

  <div class="backrow">
    <a class="back" href="/oilflows.html">?</a>
    <a class="back" href="/market.html">is this really a war?</a>
    <a class="back" href="/lab.html">reading the hormuz numbers</a>
    <a class="back" href="/">&larr; back</a>
  </div>
</div>

<script>
  const TICKER = "BNO";
  const LOW_MAX = 49;
  const HIGH_MIN = 55;
  const START = "2026-02-28"; // the consensus start of the war
  const API_KEY = "da68rdhr01qtngrev8kgda68rdhr01qtngrev8l0";
  const C_PEACE = "#3d9f6b", C_SWEET = "#d4a843", C_WAR = "#c94e4e";

  function zoneColor(p) {
    if (p < LOW_MAX) return C_PEACE;
    if (p > HIGH_MIN) return C_WAR;
    return C_SWEET;
  }
  function zoneName(p) {
    if (p < LOW_MAX) return "peace";
    if (p > HIGH_MIN) return "war";
    return "sweet spot";
  }

  async function fetchLive() {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${TICKER}&token=${API_KEY}`);
      const data = await res.json();
      if (data && data.c) return { c: data.c, h: data.h, t: data.t };
    } catch (e) {}
    return null;
  }

  function linePath(points, xFn, yFn) {
    return points.map((pt, i) =>
      `${i === 0 ? "M" : "L"}${xFn(pt).toFixed(1)},${yFn(pt).toFixed(1)}`).join(" ");
  }

  async function buildChart(history, live) {
    let points = history.filter(pt => pt.d >= START)
      .map(pt => ({ t: new Date(pt.d + "T00:00:00Z").getTime(), p: pt.p, h: pt.h }));
    if (live) points.push({ t: Date.now(), p: live.c, h: live.h });

    const W = 960, H = 460, PAD_L = 30, PAD_R = 74, PAD_T = 20, PAD_B = 32;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const prices = points.map(pt => pt.p);
    const yMin = Math.floor(Math.min(...prices, LOW_MAX) / 10) * 10;
    const yMax = Math.ceil(Math.max(...prices, HIGH_MIN) / 10) * 10;

    const x = t => PAD_L + ((t - t0) / (t1 - t0)) * (W - PAD_L - PAD_R);
    const y = p => H - PAD_B - ((p - yMin) / (yMax - yMin)) * (H - PAD_T - PAD_B);
    const px = pt => x(pt.t), py = pt => y(pt.p);
    const xR = W - PAD_R;

    const yLow = y(LOW_MAX), yHigh = y(HIGH_MIN);

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">`;

    // zone fields, same colors, quieter — labeled directly, no legend
    svg += `<rect x="${PAD_L}" y="${PAD_T}" width="${xR-PAD_L}" height="${yHigh-PAD_T}" fill="${C_WAR}" opacity="0.10"/>`;
    svg += `<rect x="${PAD_L}" y="${yHigh}" width="${xR-PAD_L}" height="${yLow-yHigh}" fill="${C_SWEET}" opacity="0.10"/>`;
    svg += `<rect x="${PAD_L}" y="${yLow}" width="${xR-PAD_L}" height="${H-PAD_B-yLow}" fill="${C_PEACE}" opacity="0.10"/>`;

    // sparse horizontal grid: every $10, label above the line, no $ signs
    for (let p = yMin; p <= yMax; p += 10) {
      const gy = y(p);
      svg += `<line x1="${PAD_L}" y1="${gy.toFixed(1)}" x2="${xR}" y2="${gy.toFixed(1)}" stroke="rgba(240,236,230,0.08)" stroke-width="0.8"/>`;
      svg += `<text x="${PAD_L}" y="${(gy - 5).toFixed(1)}" fill="rgba(240,236,230,0.3)" font-size="10">${p === yMax ? "$" + p : p}</text>`;
    }

    // the two thresholds: dashed, labeled at the right edge
    svg += `<line x1="${PAD_L}" y1="${yLow}" x2="${xR}" y2="${yLow}" stroke="rgba(240,236,230,0.3)" stroke-dasharray="5 4" stroke-width="1"/>`;
    svg += `<line x1="${PAD_L}" y1="${yHigh}" x2="${xR}" y2="${yHigh}" stroke="rgba(240,236,230,0.3)" stroke-dasharray="5 4" stroke-width="1"/>`;
    svg += `<text x="${xR+10}" y="${yLow+3}" fill="rgba(240,236,230,0.45)" font-size="10">49</text>`;
    svg += `<text x="${xR+10}" y="${yHigh+3}" fill="rgba(240,236,230,0.45)" font-size="10">55</text>`;

    // war touches: same bands, annotated once instead of a legend row
    const touches = points.map(pt => pt.h > HIGH_MIN && pt.p <= HIGH_MIN);
    let firstBandX = null;
    for (let i = 0; i < points.length; i++) {
      if (!touches[i]) continue;
      let j = i;
      while (j + 1 < points.length && touches[j + 1]) j++;
      const n = j - i + 1;
      const cx = (x(points[i].t) + x(points[j].t)) / 2;
      if (firstBandX === null) firstBandX = cx;
      const w = Math.min(2 + (n - 1) * 2.5, 10);
      svg += `<rect x="${(cx - w / 2).toFixed(1)}" y="${PAD_T}" width="${w.toFixed(1)}" height="${H - PAD_B - PAD_T}" fill="${C_WAR}" opacity="0.30"/>`;
      i = j;
    }
    if (firstBandX !== null) {
      // the label needs ~240px of clear space; flip to the band's right when the left side lacks it
      if (firstBandX - PAD_L >= 300) {
        svg += `<line x1="${(firstBandX - 46).toFixed(1)}" y1="${PAD_T + 9}" x2="${(firstBandX - 6).toFixed(1)}" y2="${PAD_T + 9}" stroke="rgba(240,236,230,0.3)" stroke-width="0.8"/>`;
        svg += `<text x="${(firstBandX - 52).toFixed(1)}" y="${PAD_T + 12}" fill="rgba(240,236,230,0.45)" font-size="9.5" text-anchor="end">touched war intraday · wider = more days in a row</text>`;
      } else {
        svg += `<line x1="${(firstBandX + 6).toFixed(1)}" y1="${PAD_T + 9}" x2="${(firstBandX + 46).toFixed(1)}" y2="${PAD_T + 9}" stroke="rgba(240,236,230,0.3)" stroke-width="0.8"/>`;
        svg += `<text x="${(firstBandX + 52).toFixed(1)}" y="${PAD_T + 12}" fill="rgba(240,236,230,0.45)" font-size="9.5">touched war intraday · wider = more days in a row</text>`;
      }
    }

    // one calm line — the bands carry the zones
    svg += `<path d="${linePath(points, px, py)}" fill="none" stroke="#e8e6e3" stroke-width="1.5" stroke-linejoin="round"/>`;

    // live point, direct-labeled
    const last = points[points.length - 1];
    const lastX = x(last.t), lastY = y(last.p), lastZc = zoneColor(last.p);
    svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="${lastZc}" stroke="#0f0f11" stroke-width="2"/>`;
    // dodge the 49/55 threshold labels when the price sits near a line
    const nearThresh = Math.min(Math.abs(lastY - yHigh), Math.abs(lastY - yLow)) < 13;
    svg += `<text x="${(lastX + 9).toFixed(1)}" y="${(nearThresh ? lastY - 10 : lastY + 3.5).toFixed(1)}" fill="${lastZc}" font-size="11" font-weight="500">$${last.p.toFixed(2)}</text>`;

    // monthly x labels under a year of data, quarterly beyond
    const monthStep = (t1 - t0) < 366 * 24 * 3600 * 1000 ? 1 : 3;
    const months = [];
    let cursor = new Date(Date.UTC(new Date(t0).getUTCFullYear(), new Date(t0).getUTCMonth(), 1));
    const end = new Date(t1);
    while (cursor <= end) {
      months.push(new Date(cursor));
      cursor = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth() + 1, 1));
    }
    months.forEach(m => {
      if (m.getUTCMonth() % monthStep !== 0) return;
      const mx = x(m.getTime());
      if (mx >= PAD_L && mx <= xR) {
        const label = m.toLocaleDateString(undefined, { month: "short", year: "2-digit", timeZone: "UTC" });
        svg += `<line x1="${mx.toFixed(1)}" y1="${H-PAD_B}" x2="${mx.toFixed(1)}" y2="${H-PAD_B+4}" stroke="rgba(240,236,230,0.25)" stroke-width="0.8"/>`;
        svg += `<text x="${mx.toFixed(1)}" y="${H-10}" fill="rgba(240,236,230,0.35)" font-size="9.5" text-anchor="middle">${label}</text>`;
      }
    });

    svg += `</svg>`;
    document.getElementById("chart-wrap").innerHTML = svg;

    document.getElementById("note").textContent =
      "Daily closes, Feb 28 2026 – present — the consensus start of the war. The final point updates live. Source: BNO daily closes; live quote via Finnhub.";
  }

  async function init() {
    const [historyRes, live] = await Promise.all([
      fetch("/history.json"),
      fetchLive()
    ]);
    const history = await historyRes.json();

    const pulse = document.querySelector(".live-pulse");
    if (live) {
      const zc = zoneColor(live.c);
      const zn = zoneName(live.c);
      if (pulse) pulse.style.background = zc;
      let when = "";
      if (live.t) {
        const tr = new Date(live.t * 1000);
        const sameDay = tr.toDateString() === new Date().toDateString();
        when = sameDay
          ? tr.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : tr.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }
      document.getElementById("price").innerHTML =
        `<span id="live-price" style="color:${zc}">$${live.c.toFixed(2)}</span> ` +
        `<span class="status-badge" style="background:${zc}15;color:${zc};border:1px solid ${zc}30">${zn}</span> ` +
        (when ? `<span style="opacity:0.5">last trade ${when}</span>` : "");
    } else {
      if (pulse) pulse.style.background = "rgba(240,236,230,0.3)";
      document.getElementById("price").innerHTML = `<span style="color:${C_WAR}">Error fetching live price</span>`;
    }

    buildChart(history, live);
  }

  init();
</script>

</body>
</html>
