name: Update SPR stocks

on:
  schedule:
    - cron: '30 19 * * 3'   # Wednesdays 19:30 UTC, after EIA's weekly petroleum status report
    - cron: '30 19 * * 4'   # Thursday catch-up for holiday weeks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install xlrd
      - run: python3 scripts/build_spr.py
      - name: commit if changed
        run: |
          git config user.name "spr-bot"
          git config user.email "actions@github.com"
          git add spr/data/spr_stocks.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "update SPR stocks"
            git push
          fi
