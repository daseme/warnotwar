name: weekly oilflows refresh
on:
  schedule:
    - cron: "30 18 * * 4"   # Thursdays 18:30 UTC — EIA publishes Wednesdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r oilflows/requirements.txt
      - run: ./scripts/refresh_weekly.sh
      - name: commit if changed
        run: |
          git config user.name "oilflows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ oilflows/data/published/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "weekly EIA data refresh"
            git push
          fi
