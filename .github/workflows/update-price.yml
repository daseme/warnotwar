name: Update BNO price

on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '30 2 * * 2-6'   # catch-up for days the first run never fires
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update price
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 scripts/update_price.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "no price change"
          else
            git commit -m "update BNO close price"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    concurrency:
      group: deploy
      cancel-in-progress: false
