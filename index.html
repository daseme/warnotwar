<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>warnotwar.com</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background-color 1.2s ease;
    background: #1a1a1a;
  }
  #message {
    font-size: 12vw;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
    transition: opacity 0.8s ease;
  }
  #price {
    position: fixed;
    bottom: 24px; left: 0; right: 0;
    text-align: center;
    font-family: monospace;
    font-size: 14px;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<div id="message"></div>
<div id="price"></div>

<script>
  // ---- CONFIG: edit these thresholds/messages/key anytime ----
  const TICKER = "BNO";
  const LOW_MAX = 49;      // below this = peace
  const HIGH_MIN = 55;     // above this = war
  const MSG_LOW  = "Peace";
  const MSG_MID  = "Perpetual war sweet spot";
  const MSG_HIGH = "War";
  const REFRESH_MS = 60000; // 60 seconds
  const API_KEY = "da68rdhr01qtngrev8kgda68rdhr01qtngrev8l0";
  // --------------------------------------------------------------

  function setMessage(text, color) {
    const el = document.getElementById("message");
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = text;
      document.body.style.backgroundColor = color;
      el.style.opacity = 1;
    }, 400);
  }

  async function fetchPrice() {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${TICKER}&token=${API_KEY}`);
      const data = await res.json();
      const price = data.c; // current price
      if (!price) throw new Error("no price");

      document.getElementById("price").textContent =
        `${TICKER} $${price.toFixed(2)} — updated ${new Date().toLocaleTimeString()}`;

      if (price < LOW_MAX) setMessage(MSG_LOW, "#173a1e");
      else if (price > HIGH_MIN) setMessage(MSG_HIGH, "#3a1717");
      else setMessage(MSG_MID, "#3a2f17");
    } catch (e) {
      document.getElementById("price").textContent = "Error fetching price.";
    }
  }

  fetchPrice();
  setInterval(fetchPrice, REFRESH_MS);
</script>

</body>
</html>
