<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 8: Challenge — Hormuz Lab (simulated scenario)</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title">Hormuz Lab <span>·</span> How a Strait Becomes a Price</div>
    <div class="grade-switch" id="grade-switch">
      <button data-g="5" class="on">5th grade</button>
      <button data-g="8">8th grade</button>
      <button data-g="12">12th grade</button>
    </div>
  </div>
</header>

<div class="date-strip" id="date-strip"></div>

<nav class="lab-nav" id="lab-nav"></nav>

<main class="lab-content">
  <section class="lab-section active" id="lab-8">
    <h2>Challenge Lab: You Decide</h2>
    <p class="subtitle" id="chal-subtitle">Click any point on the chart. Study what was publicly available. Predict what happened next.</p>
    <div id="tape-toggle"></div>
    <div class="card-grid" id="chal-chart-wrap" style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
      <div style="width:100%;">
        <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;" id="chal-chart-label">BNO (sim) share price · Click a point to select a date</div>
        <svg id="chal-svg" viewBox="0 0 640 120" style="width:100%;height:120px;display:block;"></svg>
      </div>
    </div>
    <div id="chal-freeze" style="margin-top:16px;"></div>
    <div id="chal-predict" style="margin-top:16px;"></div>
    <div id="chal-reveal" style="margin-top:16px;display:none;"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="tape.js"></script>
<script>
let chalIdx=2, chalReasons=new Set(), chalDir=null, chalRevealed=false;
let chalRReasons=new Set(), chalRDir=null, chalRRevealed=false;

function renderChallenge(){
  // Chart
  const svg=$('chal-svg');
  const W=640, H=120, pad={top:10,bottom:20,left:10,right:10};
  const minBNO=Math.min(...dates.map(d=>d.bno))*0.95;
  const maxBNO=Math.max(...dates.map(d=>d.bno))*1.05;
  const x=i=>pad.left+(i/(dates.length-1))*(W-pad.left-pad.right);
  const y=v=>pad.top+(1-(v-minBNO)/(maxBNO-minBNO))*(H-pad.top-pad.bottom);
  let s='';
  for(let i=0;i<3;i++){ const gy=pad.top+(i/2)*(H-pad.top-pad.bottom); s+=`<line x1="${pad.left}" y1="${gy}" x2="${W-pad.right}" y2="${gy}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`; }
  let areaPath=`M${x(0)},${y(dates[0].bno)}`;
  dates.forEach((d,i)=>areaPath+=` L${x(i)},${y(d.bno)}`);
  areaPath+=` L${x(dates.length-1)},${H-pad.bottom} L${x(0)},${H-pad.bottom} Z`;
  s+=`<path d="${areaPath}" fill="rgba(88,166,255,0.08)"/>`;
  let linePath=`M${x(0)},${y(dates[0].bno)}`;
  dates.forEach((d,i)=>{ if(i>0) linePath+=` L${x(i)},${y(d.bno)}`; });
  s+=`<path d="${linePath}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  dates.forEach((d,i)=>{
    const on=i===chalIdx;
    s+=`<circle cx="${x(i)}" cy="${y(d.bno)}" r="${on?6:4}" fill="${on?'var(--text-primary)':'var(--bg)'}" stroke="${on?'var(--bg)':'var(--text-primary)'}" stroke-width="${on?2:1.5}" class="chart-point${on?' on':''}" data-idx="${i}" style="cursor:pointer;transition:r 0.2s;"/>`;
    s+=`<text x="${x(i)}" y="${H-4}" fill="${on?'var(--text-primary)':'rgba(255,255,255,0.3)'}" font-size="10" text-anchor="middle">${d.label}</text>`;
    s+=`<text x="${x(i)}" y="${y(d.bno)-10}" fill="${on?'var(--text-primary)':'rgba(255,255,255,0.3)'}" font-size="10" text-anchor="middle" font-family="var(--font-mono)" font-variant-numeric="tabular-nums">$${d.bno.toFixed(2)}</text>`;
  });
  s+=`<text x="${W/2}" y="${H/2}" fill="rgba(210,153,34,0.18)" font-size="18" letter-spacing="6" text-anchor="middle" font-family="var(--font-mono)">SIMULATED</text>`;
  svg.innerHTML=s;
  svg.querySelectorAll('.chart-point').forEach(p=>{ p.onclick=()=>{ chalIdx=+p.dataset.idx; chalRevealed=false; chalReasons.clear(); chalDir=null; renderChallenge(); }; });

  // Freeze frame
  const d=dates[chalIdx];
  const next=dates[chalIdx+1];
  $('chal-freeze').innerHTML=`<div class="detail-panel"><h4><span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--text-primary);color:var(--bg);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-right:8px;">Freeze Frame</span>${d.label}, 2026 — What the market knew</h4><div class="card-grid" style="grid-template-columns:repeat(2,1fr);margin-top:12px;"><div class="card" style="cursor:default;padding:10px 12px;"><div class="c-label">Flow</div><div class="c-value" style="color:${d.hormuz<10?'var(--c4)':(d.hormuz<50?'var(--c3)':'var(--c2)')};font-size:18px;">${d.hormuz}%</div><div style="font-size:11px;color:var(--text-tertiary)">Hormuz traffic vs ${grade===5?'normal':'baseline'}</div></div><div class="card" style="cursor:default;padding:10px 12px;"><div class="c-label">Buffer</div><div class="c-value" style="color:${d.buffer<45?'var(--c3)':'var(--c2)'};font-size:18px;">${d.buffer} days</div><div style="font-size:11px;color:var(--text-tertiary)">U.S. crude cushion</div></div><div class="card" style="cursor:default;padding:10px 12px;"><div class="c-label">Brent</div><div class="c-value" style="font-size:18px;">${fmt$(d.brent)}</div><div style="font-size:11px;color:var(--text-tertiary)">Near-month futures</div></div><div class="card" style="cursor:default;padding:10px 12px;"><div class="c-label">BNO (sim)</div><div class="c-value" style="font-size:18px;">${fmt$(d.bno)}</div><div style="font-size:11px;color:var(--text-tertiary)">Share price</div></div></div><div style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.5;"><strong>News:</strong> ${d.news}. Saudi Yanbu bypass at ${d.yanbu}% of ${grade===5?'normal':'baseline'}. UAE Fujairah at ${d.fujairah}%.${next?` Next data point: <strong>${next.label}</strong>.`:' This is the last date in our dataset.'}</div></div>`;

  // Predict
  const pel=$('chal-predict');
  if(!next){ pel.innerHTML=`<div class="predict-box"><h4>What happens next?</h4><p class="pq">This is the last date in our dataset. Try selecting an earlier date to play the prediction game.</p></div>`; $('chal-reveal').style.display='none'; return; }

  let ph=`<div class="predict-box"><h4>What happens next?</h4><p class="pq">On <strong>${d.label}</strong>, the market knew all of the above. Over the next 5 trading days (to <strong>${next.label}</strong>), which signals do you think matter most? Select all that apply, then choose a direction.</p>`;
  ph+=`<div class="card-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px;">`;
  chalReasonsList.forEach(opt=>{ const on=chalReasons.has(opt.key); ph+=`<div class="card${on?' on':''}" data-key="${opt.key}" style="padding:10px 12px;display:flex;align-items:center;gap:8px;"><div style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;${on?'background:var(--text-primary);border-color:var(--text-primary);color:var(--bg);':''}">${on?'✓':''}</div><div style="font-size:13px;color:${on?'var(--text-primary)':'var(--text-secondary)'}">${grade===5&&opt.label5?opt.label5:opt.label}</div></div>`; });
  ph+=`</div>`;
  ph+=`<p class="pq" style="margin-bottom:10px;">What do you think BNO did over the next 5 trading days?</p>`;
  const dirs=[{key:'down10',label:'↓ > 10%'},{key:'down5',label:'↓ 0–10%'},{key:'flat',label:'~ flat'},{key:'up5',label:'↑ 0–10%'},{key:'up10',label:'↑ > 10%'}];
  ph+=`<div class="card-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px;">`;
  dirs.forEach(dir=>{ ph+=`<button class="guess-btn${chalDir===dir.key?' picked':''}" data-dir="${dir.key}" style="padding:10px 12px;font-size:13px;text-align:center;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:8px;cursor:pointer;transition:all 0.15s;font-family:inherit;">${dir.label}</button>`; });
  ph+=`</div>`;
  const canSubmit=chalReasons.size>0&&chalDir!==null;
  ph+=`<button class="submit-btn" id="chal-submit" ${canSubmit?'':'disabled'}>Reveal what happened</button></div>`;
  pel.innerHTML=ph;

  pel.querySelectorAll('.card[data-key]').forEach(c=>{
    c.onclick=()=>{ const key=c.dataset.key; if(chalReasons.has(key)) chalReasons.delete(key); else chalReasons.add(key); chalRevealed=false; renderChallenge(); };
  });
  pel.querySelectorAll('.guess-btn').forEach(b=>{
    b.onclick=()=>{ chalDir=b.dataset.dir; chalRevealed=false; renderChallenge(); };
  });
  const submit=document.getElementById('chal-submit');
  if(submit) submit.onclick=()=>{ if(canSubmit){ chalRevealed=true; renderChallengeReveal(); } };
}

function renderChallengeReveal(){
  const d=dates[chalIdx], next=dates[chalIdx+1];
  const el=$('chal-reveal');
  if(!next||!chalRevealed){ el.style.display='none'; return; }
  el.style.display='block';

  const actualChg=((next.bno-d.bno)/d.bno*100);
  const actualLabel=actualChg>10?'up10':actualChg>2?'up5':actualChg>=-2?'flat':actualChg>-10?'down5':'down10';
  const dirCorrect=chalDir===actualLabel;

  let reasoningScore=0, maxReasoning=0;
  chalReasonsList.forEach(opt=>{ const isCorrect=opt.correct(d); if(isCorrect) maxReasoning++; if(chalReasons.has(opt.key)&&isCorrect) reasoningScore++; if(chalReasons.has(opt.key)&&!isCorrect) reasoningScore--; });
  const totalScore=Math.max(0,reasoningScore);
  const scorePct=maxReasoning>0?Math.round((totalScore/maxReasoning)*100):0;
  const scoreColor=scorePct>=70?'var(--c2)':(scorePct>=40?'var(--c3)':'var(--c4)');
  const scoreBg=scorePct>=70?'rgba(63,185,80,0.15)':(scorePct>=40?'rgba(210,153,34,0.15)':'rgba(248,81,73,0.15)');

  let h=`<div class="detail-panel">`;
  const g5=grade===5;
  const caveat=g5?'one guess can\'t prove or break your reasoning':'one outcome can\'t validate or refute a line of reasoning';
  h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:${scoreBg};color:${scoreColor};flex-shrink:0;">${scorePct}</div><div><div style="font-size:16px;font-weight:600;">${dirCorrect?(g5?'Right direction':'Correct direction'):(g5?'Wrong direction':'Direction missed')} — ${caveat}</div><div style="font-size:13px;color:var(--text-secondary);">BNO moved from ${fmt$(d.bno)} to ${fmt$(next.bno)} — <strong>${actualChg>0?'+':''}${actualChg.toFixed(1)}%</strong></div></div></div>`;
  h+=`<div style="font-size:13px;line-height:1.7;color:var(--text-secondary);">${dirCorrect?(g5?'You called the direction. ':'You correctly predicted the direction. '):'The market moved '+ (actualChg>0?'up':'down') +' more than you expected. '}${g5?'You spotted <strong>'+totalScore+' of '+maxReasoning+'</strong> true signals.':'Your reasoning score: <strong>'+totalScore+'/'+maxReasoning+'</strong> relevant signals identified.'}</div>`;

  h+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><div style="font-size:12px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;font-weight:500;">Signal check</div>`;
  chalReasonsList.forEach(opt=>{
    const isCorrect=opt.correct(d), wasSelected=chalReasons.has(opt.key);
    const dotColor=wasSelected&&isCorrect?'var(--c2)':(wasSelected&&!isCorrect?'var(--c4)':(isCorrect?'var(--c3)':'rgba(255,255,255,0.1)'));
    const label=wasSelected&&isCorrect?'✓ You caught this':(wasSelected&&!isCorrect?(g5?'✗ Not actually true that day':'✗ You overcalled this'):(isCorrect?'○ You missed this':''));
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text-secondary);"><div style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;"></div>${g5&&opt.label5?opt.label5:opt.label} <span style="color:var(--text-tertiary);margin-left:auto;font-size:11px;">${label}</span></div>`;
  });
  h+=`</div>`;

  h+=`<div style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.6;">${g5?'Nobody scores the why. Stories about why prices moved have no answer key.':'The "why" is never scored: stories like fear of scarcity, relief from bypass routes, or hopes of a quick fix have no answer key.'}</div>`;
  h+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><div style="font-size:12px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;font-weight:500;">One reading of the move</div>`;
  h+=`<div style="font-size:13px;line-height:1.7;color:var(--text-secondary);">`;
  if(d.hormuz<10) h+=g5?`On ${d.label} in this scenario, ship traffic read ${d.hormuz}% of normal, Yanbu ${d.yanbu}%, the cushion ${d.buffer} days — and Brent stood at ${fmt$(d.brent)}, BNO at ${fmt$(d.bno)}. One story: traders feared oil would get scarce. But prices move for many reasons at once — no one can point to a single cause.`:`On ${d.label} in this scenario, Hormuz read ${d.hormuz}% of baseline, Yanbu ${d.yanbu}%, the cushion ${d.buffer} days — and Brent stood at ${fmt$(d.brent)}, BNO at ${fmt$(d.bno)}. One consistent story is scarcity expectations; prices bundle many signals at once, and no single cause is visible.`;
  else if(d.hormuz<50) h+=g5?`Traffic was falling (${d.hormuz}% of normal) but no one knew how bad it would get. Prices often jump when no one is sure what happens next.`:`Traffic was deteriorating (${d.hormuz}% of baseline) but the full extent wasn't yet clear. Markets update beliefs as new signals arrive, and prices often move sharply during the uncertain phase — one pattern among several, not a law.`;
  else h+=g5?`Things looked normal in this scenario. BNO sat around ${fmt$(d.bno)}.`:`Conditions were relatively normal in this scenario; no major supply disruption was visible. BNO sat around ${fmt$(d.bno)}.`;
  h+=`</div></div>`;

  h+=`</div>`;
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// Real-tape mode. The chart draws (and scales to) revealed checkpoints
// only, so neither the path ahead nor the y-axis leaks where the tape
// goes; peak markers are hindsight and appear only at reveal.
function renderChallengeReal(){
  const cps=TAPE.checkpoints, vi=tapeVantageIdx(), d=cps[vi], next=cps[vi+1];
  tapeChrome();
  renderTapeStrip(vi, i=>{ tapeSetVantage(i); chalRReasons.clear(); chalRDir=null; chalRRevealed=false; renderChallengeReal(); });
  $('chal-chart-label').textContent='BNO share price · dated record · Click a point to stand on that checkpoint';

  const svg=$('chal-svg');
  // top band reserved for the provenance tag so annotation and value
  // labels never collide with it
  const W=640, H=130, pad={top:30,bottom:20,left:10,right:10};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.style.height=H+'px';
  const visible=cps.slice(0,vi+1+(chalRRevealed&&next?1:0));
  const anns=chalRRevealed&&next?tapeAnnotationsBetween(d,next).filter(a=>a.label==='BNO peak'):[];
  const yVals=visible.map(c=>c.bno).concat(anns.map(a=>a.value));
  const minBNO=Math.min(...yVals)*0.95, maxBNO=Math.max(...yVals)*1.05;
  const n=Math.max(visible.length,2);
  const x=i=>pad.left+(i/(n-1))*(W-pad.left-pad.right);
  const y=v=>pad.top+(1-(v-minBNO)/(maxBNO-minBNO))*(H-pad.top-pad.bottom);
  let s='';
  for(let i=0;i<3;i++){ const gy=pad.top+(i/2)*(H-pad.top-pad.bottom); s+=`<line x1="${pad.left}" y1="${gy}" x2="${W-pad.right}" y2="${gy}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`; }
  let linePath=`M${x(0)},${y(visible[0].bno)}`;
  visible.forEach((c,i)=>{ if(i>0) linePath+=` L${x(i)},${y(c.bno)}`; });
  s+=`<path d="${linePath}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  visible.forEach((c,i)=>{
    const on=i===vi, isReveal=i>vi;
    s+=`<circle cx="${x(i)}" cy="${y(c.bno)}" r="${on?6:4}" fill="${on?'var(--text-primary)':(isReveal?'#58a6ff':'var(--bg)')}" stroke="${on?'var(--bg)':(isReveal?'#58a6ff':'var(--text-primary)')}" stroke-width="${on?2:1.5}" class="chart-point${on?' on':''}" data-idx="${i}" style="cursor:pointer;"/>`;
    s+=`<text x="${x(i)}" y="${H-4}" fill="${on?'var(--text-primary)':'rgba(255,255,255,0.3)'}" font-size="10" text-anchor="middle">${tapeDay(c.date)}</text>`;
    s+=`<text x="${x(i)}" y="${Math.max(y(c.bno)-10,pad.top+8)}" fill="${on?'var(--text-primary)':'rgba(255,255,255,0.3)'}" font-size="10" text-anchor="middle" font-family="var(--font-mono)" font-variant-numeric="tabular-nums">$${c.bno.toFixed(2)}</text>`;
  });
  anns.forEach((a,ai)=>{
    const span=d.days_to_next||1;
    const frac=Math.min(1,Math.max(0,(new Date(a.date)-new Date(d.date))/86400000/span));
    const ax=x(vi)+(x(vi+1)-x(vi))*frac;
    s+=`<path d="M${ax},${y(a.value)-4} l4,7 h-8 z" fill="#d29922"/>`;
    s+=`<text x="${pad.left}" y="${12+ai*11}" fill="#d29922" font-size="9" text-anchor="start" font-family="var(--font-mono)">▼ ${a.label} $${a.value.toFixed(2)} · ${tapeDay(a.date)} (hindsight)</text>`;
  });
  s+=`<text x="${W-pad.right}" y="12" fill="rgba(88,166,255,0.55)" font-size="9" letter-spacing="1.5" text-anchor="end" font-family="var(--font-mono)">REAL RECORD · AS OF ${tapeDay(cps[cps.length-1].date).toUpperCase()} · WARNOTWAR.COM</text>`;
  svg.innerHTML=s;
  svg.querySelectorAll('.chart-point').forEach(p=>{ p.onclick=()=>{ tapeSetVantage(+p.dataset.idx); chalRReasons.clear(); chalRDir=null; chalRRevealed=false; renderChallengeReal(); }; });

  const cards=tapeFieldCards(d);
  $('chal-freeze').innerHTML=`<div class="detail-panel"><h4><span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--text-primary);color:var(--bg);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-right:8px;">Freeze Frame</span>${tapeDayFull(d.date)} — publicly available by this date</h4><div class="card-grid" style="grid-template-columns:repeat(2,1fr);margin-top:12px;">${cards.map(c=>`<div class="card" style="cursor:default;padding:10px 12px;"><div class="c-label">${c.label}</div><div class="c-value" style="font-size:18px;">${c.value}</div><div style="font-size:11px;color:var(--text-tertiary)">${c.sub}${c.asof?' · '+(c.key==='buffer'?c.asof:'as of '+tapeDay(c.asof)):''}</div></div>`).join('')}</div><div style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.5;">Why this date is on the tape: ${d.why}. Bypass activity — Yanbu ${d.yanbu===null?'no reading':d.yanbu}, Fujairah ${d.fujairah===null?'no reading':d.fujairah} (activity signals, not barrels).${next?` Next checkpoint: <strong>${tapeDayFull(next.date)}</strong> (${d.days_to_next} days later).`:' The tape ends here.'}</div>${tapeSourcesLine(d)}</div>`;

  const pel=$('chal-predict');
  if(!next){ pel.innerHTML=`<div class="predict-box"><h4>What happens next?</h4><p class="pq">The tape ends here — come back after the next weekly data update, or step back to an earlier checkpoint.</p></div>`; $('chal-reveal').style.display='none'; return; }

  let ph=`<div class="predict-box"><h4>What happens next?</h4><p class="pq">Everything above was publicly available by <strong>${tapeDayFull(d.date)}</strong>. Which of these factual reads of the freeze frame are accurate? Select all that apply, then record a direction call.</p>`;
  ph+=`<div class="card-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px;">`;
  TAPE.reads.forEach(opt=>{ const res=tapeReadEval(opt,d); const dead=res===null; const on=chalRReasons.has(opt.key); ph+=`<div class="card${on?' on':''}" data-key="${dead?'':opt.key}" style="padding:10px 12px;display:flex;align-items:center;gap:8px;${dead?'opacity:0.4;cursor:default;':''}"><div style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;${on?'background:var(--text-primary);border-color:var(--text-primary);color:var(--bg);':''}">${on?'✓':''}</div><div style="font-size:13px;color:${on?'var(--text-primary)':'var(--text-secondary)'}">${opt.label}${dead?' — no reading published by this date; not scored':''}</div></div>`; });
  ph+=`</div>`;
  ph+=`<p class="pq" style="margin-bottom:10px;">By ${tapeDayFull(next.date)} (${d.days_to_next} days later), what did BNO do? Your call is recorded, never graded — one interval cannot validate a line of reasoning.</p>`;
  ph+=`<div class="card-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px;">`;
  TAPE_DIRS.forEach(dir=>{ ph+=`<button class="guess-btn${chalRDir===dir.key?' picked':''}" data-dir="${dir.key}" style="padding:10px 12px;font-size:13px;text-align:center;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:8px;cursor:pointer;transition:all 0.15s;font-family:inherit;">${dir.label}</button>`; });
  ph+=`</div>`;
  const canSubmit=chalRReasons.size>0&&chalRDir!==null;
  ph+=`<button class="submit-btn" id="chal-submit" ${canSubmit?'':'disabled'}>Reveal the next checkpoint</button></div>`;
  pel.innerHTML=ph;

  pel.querySelectorAll('.card[data-key]').forEach(c=>{
    c.onclick=()=>{ const key=c.dataset.key; if(!key) return; if(chalRReasons.has(key)) chalRReasons.delete(key); else chalRReasons.add(key); chalRRevealed=false; renderChallengeReal(); };
  });
  pel.querySelectorAll('.guess-btn').forEach(b=>{
    b.onclick=()=>{ chalRDir=b.dataset.dir; chalRRevealed=false; renderChallengeReal(); };
  });
  const submit=document.getElementById('chal-submit');
  if(submit) submit.onclick=()=>{ if(canSubmit){ chalRRevealed=true; renderChallengeReal(); renderChallengeRealReveal(); } };
  if(!chalRRevealed) $('chal-reveal').style.display='none'; else renderChallengeRealReveal();
}

function renderChallengeRealReveal(){
  const cps=TAPE.checkpoints, vi=tapeVantageIdx(), d=cps[vi], next=cps[vi+1];
  const el=$('chal-reveal');
  if(!next||!chalRRevealed){ el.style.display='none'; return; }
  el.style.display='block';

  const evaluable=TAPE.reads.filter(r=>tapeReadEval(r,d)!==null);
  let reasoningScore=0, maxReasoning=0;
  evaluable.forEach(opt=>{ const isCorrect=tapeReadEval(opt,d); if(isCorrect) maxReasoning++; if(chalRReasons.has(opt.key)&&isCorrect) reasoningScore++; if(chalRReasons.has(opt.key)&&!isCorrect) reasoningScore--; });
  const totalScore=Math.max(0,reasoningScore);
  const scorePct=maxReasoning>0?Math.round((totalScore/maxReasoning)*100):0;
  const scoreColor=scorePct>=70?'var(--c2)':(scorePct>=40?'var(--c3)':'var(--c4)');
  const scoreBg=scorePct>=70?'rgba(63,185,80,0.15)':(scorePct>=40?'rgba(210,153,34,0.15)':'rgba(248,81,73,0.15)');

  let h=`<div class="detail-panel">`;
  h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:${scoreBg};color:${scoreColor};flex-shrink:0;">${scorePct}</div><div><div style="font-size:16px;font-weight:600;">The tape, ${tapeDay(d.date)} → ${tapeDay(next.date)}</div><div style="font-size:13px;color:var(--text-secondary);">${tapeOutcomeLine(d,next)}</div></div></div>`;
  h+=`<div style="font-size:13px;line-height:1.7;color:var(--text-secondary);">Your call: <strong>${tapeDirLabel(chalRDir)}</strong> — recorded, not graded. The score above covers only the factual reads of the freeze frame, which were verifiable when you made them: <strong>${totalScore}/${maxReasoning}</strong>.</div>`;

  h+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><div style="font-size:12px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;font-weight:500;">Signal check</div>`;
  evaluable.forEach(opt=>{
    const isCorrect=tapeReadEval(opt,d), wasSelected=chalRReasons.has(opt.key);
    const dotColor=wasSelected&&isCorrect?'var(--c2)':(wasSelected&&!isCorrect?'var(--c4)':(isCorrect?'var(--c3)':'rgba(255,255,255,0.1)'));
    const label=wasSelected&&isCorrect?'✓ You caught this':(wasSelected&&!isCorrect?'✗ You overcalled this':(isCorrect?'○ You missed this':''));
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--text-secondary);"><div style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;"></div>${opt.label} <span style="color:var(--text-tertiary);margin-left:auto;font-size:11px;">${label}</span></div>`;
  });
  h+=`</div>`;

  const ann=tapeAnnotationsBetween(d,next);
  if(ann.length) h+=`<div style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.6;">${ann.map(a=>`Between these checkpoints the record contains the ${a.label}: ${fmt$(a.value)} on ${tapeDayFull(a.date)} — ${a.note}.`).join(' ')}</div>`;
  h+=`<div style="margin-top:10px;font-size:12px;color:var(--text-tertiary);line-height:1.6;">The "why" is never scored: stories like fear of scarcity, relief from bypass routes, or hopes of a quick fix have no answer key. Possible explanations for the real record are laid out at <a href="/oilflows.html">oilflows</a>.</div>`;
  h+=`</div>`;
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderChallengeAny(){
  const sub=$('chal-subtitle');
  if(sub) sub.textContent=grade===5
    ?'Click a point on the chart. See what was known that day. Guess what happened next.'
    :'Click any point on the chart. Study what was publicly available. Predict what happened next.';
  if(window._tape==='real'&&TAPE){ renderChallengeReal(); }
  else {
    const svg=$('chal-svg'); svg.setAttribute('viewBox','0 0 640 120'); svg.style.height='120px';
    $('chal-chart-label').textContent='BNO (sim) share price · Click a point to select a date';
    renderHeader(); renderChallenge();
  }
}

function onDateChange() {
  if(window._tape!=='real') renderHeader();
}

function onGradeChange() {
  renderChallengeAny();
}

function onPageInit() {
  const boot=()=>{
    renderTapeToggle(()=>{ chalReasons.clear(); chalDir=null; chalRevealed=false; chalRReasons.clear(); chalRDir=null; chalRRevealed=false; renderChallengeAny(); });
    renderChallengeAny();
    // render-test hook: #t=real&test8=1 exercises the reveal path
    if(window._tape==='real'&&location.hash.includes('test8=1')){ chalRReasons.add('flow'); chalRDir='down5'; renderChallengeReal(); const s=document.getElementById('chal-submit'); if(s) s.click(); }
  };
  if(window._tape==='real'){ tapeLoad().then(()=>{ tapeChrome(); boot(); }); } else { boot(); }
}
</script>
