<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 6: Explain This Day — Hormuz Lab (simulated scenario)</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title">Hormuz Lab <span>·</span> How a Strait Becomes a Price</div>
    <div class="grade-switch" id="grade-switch">
      <button data-g="5" class="on">5th grade</button>
      <button data-g="8">8th grade</button>
      <button data-g="12">12th grade</button>
    </div>
  </div>
</header>

<div class="date-strip" id="date-strip"></div>

<nav class="lab-nav" id="lab-nav"></nav>

<main class="lab-content">
  <section class="lab-section active" id="lab-6">
    <h2>Lab 6: Explain This Day</h2>
    <p class="subtitle" id="l6-subtitle">What was publicly available on a given day. What do you think happened next?</p>
    <div id="tape-toggle"></div>
    <div class="card-grid" id="l6-dash"></div>
    <div id="l6-detail"></div>
    <div class="predict-box" id="l6-predict"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="tape.js"></script>
<script>
let l6Open='flow', l6Guess=null, l6rGuess=null;

function renderL6(){
  const d=dates[dateIdx], prev=dateIdx>0?dates[dateIdx-1]:null;
  const cards=[
    {key:'flow',label:'Flow',value:d.hormuz+'%',tag:d.hormuz<10?'Crisis':(d.hormuz<50?'Disrupted':'Normal'),tagClass:d.hormuz<10?'tag-down':(d.hormuz<50?'tag-warn':'tag-info')},
    {key:'buffer',label:'Buffer',value:d.buffer+' days',tag:d.buffer<45?'Tight':'Adequate',tagClass:d.buffer<45?'tag-warn':'tag-info'},
    {key:'brent',label:'Brent',value:fmt$(d.brent),tag:prev?((d.brent>prev.brent?'+':'')+(((d.brent-prev.brent)/prev.brent*100).toFixed(1))+'%'):'—',tagClass:prev?(d.brent>prev.brent?'tag-down':'tag-up'):'tag-neutral'},
    {key:'bno',label:'BNO',value:fmt$(d.bno),tag:prev?((d.bno>prev.bno?'+':'')+(((d.bno-prev.bno)/prev.bno*100).toFixed(1))+'%'):'—',tagClass:prev?(d.bno>prev.bno?'tag-down':'tag-up'):'tag-neutral'}
  ];
  $('l6-dash').innerHTML=cards.map(c=>{ const on=c.key===l6Open; return `<div class="card${on?' on':''}" data-key="${c.key}"><div class="c-label">${c.label}</div><div class="c-value">${c.value}</div><span class="c-tag ${c.tagClass}">${c.tag}</span></div>`; }).join('');
  $('l6-dash').querySelectorAll('.card').forEach(c=>{ c.onclick=()=>{ l6Open=c.dataset.key; renderL6(); }; });

  const g5=grade===5;
  let h='<div class="detail-panel">';
  if(l6Open==='flow'){
    const flowNote=d.hormuz<10
      ?(g5?'Almost no ships are moving. Other routes (Yanbu at '+d.yanbu+'%, Fujairah at '+d.fujairah+'%) are busier, but they carry less than Hormuz did.':'Near-total collapse. Bypass routes (Yanbu at '+d.yanbu+'%, Fujairah at '+d.fujairah+'%) are active; in this scenario they run below Hormuz volumes.')
      :(d.hormuz<50
        ?(g5?'Ship traffic is way down. Some oil may still move on ships that hide their signals — no one can count them.':'Significant disruption. Some oil likely moves through dark vessels or ship-to-ship transfers, but these are not independently verifiable.')
        :(g5?'Traffic looks normal.':'Traffic within normal range. No immediate supply concern from the strait.'));
    h+=`<h4>Flow layer — ${d.label}</h4><p>${g5?'Ship traffic at Hormuz':'Hormuz visible transit'}: <strong>${d.hormuz}%</strong> of ${g5?'normal':'baseline'}.</p><p>${flowNote}</p>`; }
  else if(l6Open==='buffer'){ h+=`<h4>Buffer layer — ${d.label}</h4><p>U.S. ${g5?'oil cushion':'combined crude cushion'}: <strong>${d.buffer} days</strong> of supply.</p><p>${d.buffer<45?(g5?'Lower than usual. A thinner cushion means a supply problem hurts more.':'Below the 5-year average. A low buffer absorbs less of the shock.'):(g5?'A normal amount. Enough padding for a short problem.':'Within normal range. Adequate cushion for short-term disruptions.')}</p>`; }
  else if(l6Open==='brent'){ h+=`<h4>Brent ${g5?'':'futures '}layer — ${d.label}</h4><p>${g5?'The oil price':'ICE Brent near-month futures'}: <strong>${fmt$(d.brent)}</strong></p>${prev?'<p>Change from '+prev.label+': <strong>'+((d.brent>prev.brent?'+':'')+(((d.brent-prev.brent)/prev.brent*100).toFixed(1)))+'%</strong></p>':''}<p>${g5?'Prices moved before the official numbers came out. Was that smart guessing or fear? This lab can\'t say.':'Prices moved before official export data was published. Whether that reflected good information or fear is a question this lab can\'t settle.'}</p>`; }
  else { h+=`<h4>BNO layer — ${d.label}</h4><p>BNO share price: <strong>${fmt$(d.bno)}</strong></p>${prev?'<p>Change from '+prev.label+': <strong>'+((d.bno>prev.bno?'+':'')+(((d.bno-prev.bno)/prev.bno*100).toFixed(1)))+'%</strong></p>':''}<p>${g5?'BNO follows the daily moves of oil contracts. It does not hold any actual oil.':'BNO tracks daily % changes in short-term Brent futures, plus collateral, minus expenses. It does not hold physical oil.'}</p>`; }
  h+=`<div class="note">${g5?'This is what was known that day. It does not prove what moved the price.':'These are the conditions that existed. They do not constitute proof that any one item caused any specific price move.'}</div></div>`;
  $('l6-detail').innerHTML=h;

  const next=dates[dateIdx+1];
  const pel=$('l6-predict');
  if(!next){ pel.innerHTML=`<h4>What happens next?</h4><p class="pq">This is the last date in our dataset (${d.label}). In the full lab, you would see what happened over the following weeks and months.</p><p class="pq" style="margin-top:8px;color:var(--text-tertiary);">Try selecting an earlier date to play the prediction game.</p>`; return; }

  const guesses=[{label:'↓ more than 10%',val:'down10'},{label:'↓ 0–10%',val:'down5'},{label:'roughly flat',val:'flat'},{label:'↑ 0–10%',val:'up5'},{label:'↑ more than 10%',val:'up10'}];
  let ph=`<h4>What happens next?</h4><p class="pq">On <strong>${d.label}</strong>, the market knew all of the above. Over the next 5 trading days (to <strong>${next.label}</strong>), what do you think BNO did?</p>`;
  ph+=`<div class="timeline-mini">${dates.map((dt,i)=>`<span class="tl-date${i===dateIdx?' on':''}">${dt.label}</span>${i<dates.length-1?'<span class="tl-arrow">→</span>':''}`).join('')}</div>`;
  ph+=`<div class="guess-grid">${guesses.map(g=>`<button class="guess-btn${l6Guess===g.val?' picked':''}" data-val="${g.val}">${g.label}</button>`).join('')}</div>`;
  ph+=`<div class="reveal-box${l6Guess?' show':''}" id="l6-reveal"><div class="rl" id="l6-rl"></div><div class="rn" id="l6-rn"></div></div>`;
  pel.innerHTML=ph;
  pel.querySelectorAll('.guess-btn').forEach(b=>{
    b.onclick=()=>{
      l6Guess=b.dataset.val;
      const actualChg=((next.bno-d.bno)/d.bno*100);
      const actualLabel=actualChg>10?'up10':actualChg>2?'up5':actualChg>=-2?'flat':actualChg>-10?'down5':'down10';
      const correct=l6Guess===actualLabel;
      renderL6();
      const g5r=grade===5;
      const caveat=g5r?'One right guess can\'t prove your reasoning — and one wrong guess can\'t break it.':'One outcome can\'t validate or refute a line of reasoning.';
      $('l6-rl').innerHTML=correct?`<span style="color:var(--c2)">Correct direction.</span> ${caveat} BNO moved from ${fmt$(d.bno)} to ${fmt$(next.bno)} — <strong>${actualChg>0?'+':''}${actualChg.toFixed(1)}%</strong>.`:`BNO moved from ${fmt$(d.bno)} to ${fmt$(next.bno)} — <strong>${actualChg>0?'+':''}${actualChg.toFixed(1)}%</strong>.`;
      let note='';
      if(d.hormuz<10&&actualChg>0) note=g5r?'Prices rose while almost no oil moved and the cushion was thin. One story: traders feared oil would get scarce. But prices move for many reasons at once — no one can point to a single cause.':'Prices rose while Hormuz traffic was near zero and the cushion was thin. One consistent story is scarcity expectations — but prices bundle many signals at once, and no single cause is visible.';
      else if(d.hormuz<50&&actualChg>0) note=g5r?'Traffic was falling but not gone. Prices often jump when no one is sure what happens next.':'Traffic was falling but not yet collapsed. Prices often move sharply amid uncertainty — one pattern among several, not a law.';
      else note=g5r?'The market watches many signals at once. What matters is thinking through the chain: is oil moving, how big is the cushion, what do traders expect, what is the price.':'Markets weigh many signals at once. Reasoning through the chain (flow → buffer → expectations → price) is what matters.';
      $('l6-rn').textContent=note;
    };
  });
}

// Real-tape mode: rule-derived dated checkpoints from the record.
// Direction outcomes are reported, never graded; later checkpoints
// stay masked until the reader stands on them.
function renderL6Real(){
  const cps=TAPE.checkpoints, vi=tapeVantageIdx(), d=cps[vi], next=cps[vi+1];
  tapeChrome();
  renderTapeStrip(vi, i=>{ tapeSetVantage(i); l6rGuess=null; renderL6Real(); });

  const cards=tapeFieldCards(d);
  $('l6-dash').innerHTML=cards.map(c=>{ const on=c.key===l6Open; return `<div class="card${on?' on':''}" data-key="${c.key}"><div class="c-label">${c.label}</div><div class="c-value">${c.value}</div><span class="c-tag tag-neutral">${c.asof?('as of '+(c.key==='buffer'?c.asof:tapeDay(c.asof))):'no reading'}</span></div>`; }).join('');
  $('l6-dash').querySelectorAll('.card').forEach(c=>{ c.onclick=()=>{ l6Open=c.dataset.key; renderL6Real(); }; });

  let h='<div class="detail-panel">';
  if(l6Open==='flow'){
    h+=`<h4>Flow layer — checkpoint ${tapeDayFull(d.date)} (${d.why})</h4>`;
    h+=d.hormuz===null?`<p>No Hormuz activity reading had been published by this date.</p>`:`<p>Hormuz activity index: <strong>${d.hormuz}</strong> as of ${tapeDayFull(d.hormuz_asof)} — a 7-day average where the July–December 2025 average equals 100. Readings trail the calendar by a few days and are revised after first publication.</p>`;
    if(d.yanbu!==null||d.fujairah!==null){ h+=`<p>Bypass terminals: Yanbu ${d.yanbu===null?'no reading':d.yanbu}${d.yanbu_asof?' (as of '+tapeDay(d.yanbu_asof)+')':''}, Fujairah ${d.fujairah===null?'no reading':d.fujairah}${d.fujairah_asof?' (as of '+tapeDay(d.fujairah_asof)+')':''}. These are ship-activity signals, not barrels.</p>`; }
  }
  else if(l6Open==='buffer'){ h+=`<h4>Buffer layer — checkpoint ${tapeDayFull(d.date)}</h4><p>Latest published EIA week: ${d.buffer_week_end?'week ending '+tapeDayFull(d.buffer_week_end):'none yet'} — <strong>${d.buffer===null?'no reading':d.buffer+' days'}</strong> of supply (U.S. crude stocks including the Strategic Petroleum Reserve, divided by refinery inputs). Each week is released about five to six days after it ends; this is the latest week that had been released by ${tapeDay(d.date)}.</p>`; }
  else if(l6Open==='brent'){ h+=`<h4>Brent layer — checkpoint ${tapeDayFull(d.date)}</h4><p>Brent spot: <strong>${fmt$(d.brent)}</strong>, last close observed ${tapeDayFull(d.brent_asof)}.</p><p>Prices move on many signals at once; no single cause is observable in a price.</p>`; }
  else { h+=`<h4>BNO layer — checkpoint ${tapeDayFull(d.date)}</h4><p>BNO share price: <strong>${fmt$(d.bno)}</strong>, last close observed ${tapeDayFull(d.bno_asof)}.</p><p>BNO tracks daily % changes in short-term Brent futures, plus collateral, minus expenses. It does not hold physical oil.</p>`; }
  h+=tapeSourcesLine(d);
  h+=`<div class="note">Conditions on the record by this date. They do not establish what caused any price move.</div></div>`;
  $('l6-detail').innerHTML=h;

  const pel=$('l6-predict');
  if(!next){ pel.innerHTML=`<h4>What happens next?</h4><p class="pq">The tape ends here — ${tapeDayFull(d.date)} is the latest checkpoint. Come back after the next weekly data update, or step back to an earlier checkpoint.</p>`; return; }

  let ph=`<h4>What happens next?</h4><p class="pq">Everything above was publicly available by <strong>${tapeDayFull(d.date)}</strong>. By the next checkpoint, <strong>${tapeDayFull(next.date)}</strong> (${d.days_to_next} days later), what did BNO do?</p>`;
  const shown=cps.slice(0,vi+2);
  ph+=`<div class="timeline-mini">${shown.map((c,i)=>`<span class="tl-date${i===vi?' on':''}">${tapeDay(c.date)}</span>${i<shown.length-1?'<span class="tl-arrow">→</span>':''}`).join('')}${vi+2<cps.length?'<span class="tl-arrow">→</span><span class="tl-date" style="opacity:0.45">later checkpoints hidden</span>':''}</div>`;
  ph+=`<div class="guess-grid">${TAPE_DIRS.map(g=>`<button class="guess-btn${l6rGuess===g.key?' picked':''}" data-val="${g.key}">${g.label}</button>`).join('')}</div>`;
  ph+=`<div class="reveal-box${l6rGuess?' show':''}" id="l6-reveal"><div class="rl" id="l6-rl"></div><div class="rn" id="l6-rn"></div></div>`;
  pel.innerHTML=ph;
  pel.querySelectorAll('.guess-btn').forEach(b=>{
    b.onclick=()=>{
      l6rGuess=b.dataset.val;
      renderL6Real();
      $('l6-rl').innerHTML=`Your call: ${tapeDirLabel(l6rGuess)}. The tape: ${tapeOutcomeLine(d,next)}`;
      const ann=tapeAnnotationsBetween(d,next).map(a=>`Between these checkpoints the record contains the ${a.label}: ${fmt$(a.value)} on ${tapeDayFull(a.date)} — ${a.note}.`).join(' ');
      $('l6-rn').textContent=(ann?ann+' ':'')+'One interval cannot validate or refute a line of reasoning, so direction calls are recorded, never graded.';
    };
  });
}

function renderL6Any(){
  const sub=$('l6-subtitle');
  if(sub) sub.textContent=grade===5
    ?'Everything known on one day. What do you think happened next?'
    :'What was publicly available on a given day. What do you think happened next?';
  if(window._tape==='real'&&TAPE){ renderL6Real(); } else { renderHeader(); renderL6(); }
}

function onDateChange() {
  renderL6Any();
}

function onGradeChange() {
  renderL6Any();
}

function onPageInit() {
  const boot=()=>{
    renderTapeToggle(()=>{ l6Guess=null; l6rGuess=null; renderL6Any(); });
    renderL6Any();
    // render-test hook: #t=real&test6=1 exercises the reveal path
    if(window._tape==='real'&&location.hash.includes('test6=1')){ const b=document.querySelector('#l6-predict .guess-btn[data-val="down5"]'); if(b) b.click(); }
  };
  if(window._tape==='real'){ tapeLoad().then(()=>{ tapeChrome(); boot(); }); } else { boot(); }
}
</script>

</body>
</html>
