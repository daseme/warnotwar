<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 1: Follow the Oil — Hormuz Lab (simulated scenario)</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title">Hormuz Lab <span>·</span> How a Strait Becomes a Price</div>
    <div class="grade-switch" id="grade-switch">
      <button data-g="5" class="on">5th grade</button>
      <button data-g="8">8th grade</button>
      <button data-g="12">12th grade</button>
    </div>
  </div>
</header>

<div class="date-strip" id="date-strip"></div>

<nav class="lab-nav" id="lab-nav"></nav>

<main class="lab-content">
  <section class="lab-section active" id="lab-1">
    <h2>Lab 1: Follow the Oil</h2>
    <p class="subtitle">Where does Gulf crude go? Select a figure to see what it actually measures.</p>
    <div class="card-grid" id="l1-cards"></div>
    <div id="l1-detail"></div>
    <div id="l1-schematic" style="margin-top:16px;"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
let l1Open = 'c1';

function renderL1() {
  const el = $('l1-cards');
  el.innerHTML = items.map(it => {
    const on = it.id === l1Open;
    const uCard = {mbd:'million barrels per day', tankers_per_night:'tankers per night · both directions', mbbl_single_day:'million barrels · one single day'};
    return `<div class="card${on?' on':''}" data-id="${it.id}"><div class="c-label">${it.speaker}</div><div class="c-value">${figNum(it)}</div><span class="c-tag tag-info">${uCard[it.unit]}</span>${it.differs?'<span class="c-tag tag-warn">figures differ</span>':''}</div>`;
  }).join('');
  el.querySelectorAll('.card').forEach(c => {
    c.onclick = () => { l1Open = c.dataset.id; renderL1(); };
  });

  const it = items.find(x => x.id === l1Open);
  const g5 = grade === 5;
  const CHECK5 = {
    c1:'No one outside the government can check this number.',
    c2:'Can be checked later, against official export numbers.',
    c3:'Matches ship tracking — but it counts ships, not oil.',
    c4:'Can be checked when loading data comes out.',
    c5:'No one can check this — there is no public count for the whole region.',
  };
  const EVIDENCE5 = {
    government_estimate:'a government estimate — the data behind it is secret',
    commercial_tracker_model:'a company’s estimate, reported in the news',
    activity_index:'a count of ship signals — not barrels',
  };
  const what = it.unit==='tankers_per_night' ? (g5?'ship movements — not oil':'ship movements — not oil volume') : COMM[it.commodity];
  const dir = it.scope==='ship_transits_in_and_out' ? (g5?'both directions — ships coming in are empty':'both directions — inbound tankers travel empty') : 'outbound';
  $('l1-detail').innerHTML = `<div class="detail-panel"><h4>${it.speaker} — ${figText(it)}</h4><p><strong>What:</strong> ${what}</p><p><strong>Where:</strong> ${SCOPE[it.scope]}</p><p><strong>Direction:</strong> ${dir}</p><p><strong>Window:</strong> ${WINDOW[it.period]}</p><p><strong>Source:</strong> ${g5?EVIDENCE5[it.evidence]:EVIDENCE[it.evidence]}</p><p><strong>${g5?'Can we check it?':'Checkability:'}</strong> ${g5?CHECK5[it.id]:it.check}</p>${it.differs?(()=>{const o=items.find(x=>x.id===it.differs);return '<p><strong>Figures differ:</strong> '+(g5?'Another card gives a different number for the same thing: '+o.speaker+' — '+figText(o)+'. Nobody knows yet which is right.':'compare with '+o.speaker+' — '+figText(o)+'. Both readings are shown equal-weight; the difference is unverified, and neither card wins.')+' <a href="#" id="l1-goto" data-goto="'+o.id+'">View the other card →</a></p>';})():''}<div class="note">"${it.quote}" — ${it.source}</div></div>`;
  const goto=$('l1-goto'); if(goto) goto.onclick=(e)=>{e.preventDefault(); l1Open=goto.dataset.goto; renderL1();};

  // Schematic
  const d = dates[dateIdx];
  const isHormuz = it.scope === 'hormuz_outbound';
  const isRegional = it.scope === 'regional_total_including_bypass';
  const isShips = it.unit === 'tankers_per_night';
  const COUNTRIES = [
    {id:'iraq',name:'IRAQ',y:55,color:'#f85149'},{id:'kuwait',name:'KUWAIT',y:95,color:'#d29922'},
    {id:'saudi',name:'SAUDI',y:145,color:'#3fb950'},{id:'uae',name:'UAE',y:195,color:'#58a6ff'},
    {id:'iran',name:'IRAN',y:245,color:'#a371f7'},{id:'qatar',name:'QATAR',y:285,color:'#79c0ff'}
  ];
  const SX = 380, WX = 720, H = 340;
  let s = `<svg viewBox="0 0 800 ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><filter id="glow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  s += `<text x="${SX/2}" y="${H-10}" fill="rgba(255,255,255,0.1)" font-size="14" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="3">PERSIAN GULF</text>`;
  s += `<text x="${(SX+40+800)/2}" y="${H-10}" fill="rgba(255,255,255,0.1)" font-size="14" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="3">WORLD</text>`;
  COUNTRIES.forEach(c => {
    // color by STATE, never by country identity:
    //   blue = counted by this figure; gold = in the total but not
    //   separable in public data (Iran/Qatar); dim = not counted.
    //   Ship counts light the gate, not the oil routes.
    const isVolume = isHormuz || isRegional;
    const counted = c.id==='iran' || c.id==='qatar';
    const lit = isVolume && !counted;
    const gold = isVolume && counted;
    const nc = lit ? 'var(--accent)' : (gold ? '#d29922' : 'rgba(255,255,255,0.2)');
    const lc = lit ? '#fff' : (gold ? '#d29922' : 'rgba(255,255,255,0.35)');
    s += `<circle cx="60" cy="${c.y}" r="5" fill="${nc}"${lit?' filter="url(#glow)"':''}/>`;
    s += `<text x="48" y="${c.y+4}" fill="${lc}" font-size="10" font-family="var(--font-mono)" text-anchor="end">${c.name}</text>`;
    const cp = (60 + SX) / 2;
    s += `<path d="M65,${c.y} Q${cp},${c.y} ${SX},${c.y < 170 ? 155 : (c.y > 230 ? 215 : 185)}" fill="none" stroke="${lit ? 'var(--accent)' : (gold ? '#d29922' : 'rgba(255,255,255,0.08)')}" stroke-width="${(lit||gold)?2:1}" stroke-linecap="round"/>`;
    if (lit) s += `<circle r="2" fill="var(--accent)"><animateMotion dur="2s" repeatCount="indefinite" path="M65,${c.y} Q${cp},${c.y} ${SX},${c.y < 170 ? 155 : (c.y > 230 ? 215 : 185)}"/></circle>`;
  });
  if (isHormuz || isRegional) {
    s += `<text x="${(60+SX)/2}" y="${245-9}" fill="#d29922" font-size="8.5" font-family="var(--font-mono)" text-anchor="middle">counted in the total — no public number says how much</text>`;
  }
  s += `<rect x="${SX}" y="70" width="24" height="200" rx="4" fill="${isShips?'rgba(88,166,255,0.3)':'rgba(255,255,255,0.06)'}" stroke="${isShips?'var(--accent)':'rgba(255,255,255,0.15)'}" stroke-width="1.5"/>`;
  s += `<text x="${SX+12}" y="62" fill="${isShips?'var(--accent)':'rgba(255,255,255,0.3)'}" font-size="10" font-family="var(--font-mono)" text-anchor="middle">HORMUZ</text>`;
  if (!isShips) {
    s += `<path d="M${SX+24},185 Q${(SX+24+WX)/2},185 ${WX-20},185" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;
    s += `<circle r="2.5" fill="var(--accent)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M${SX+24},185 Q${(SX+24+WX)/2},185 ${WX-20},185"/></circle>`;
  }
  s += `<circle cx="${WX-10}" cy="185" r="7" fill="rgba(63,185,80,0.2)" stroke="#3fb950" stroke-width="1.5"/>`;
  s += `<text x="${WX-10}" y="210" fill="rgba(63,185,80,0.6)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">WORLD</text>`;
  if (isRegional) {
    s += `<path d="M65,145 Q220,145 220,300 Q220,320 ${WX-20},320" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    s += `<circle r="2" fill="#3fb950"><animateMotion dur="3s" repeatCount="indefinite" path="M65,145 Q220,145 220,300 Q220,320 ${WX-20},320"/></circle>`;
    s += `<text x="220" y="${H-25}" fill="#3fb950" font-size="9" font-family="var(--font-mono)" text-anchor="middle">→ Yanbu</text>`;
    s += `<path d="M65,195 Q300,195 300,280 Q300,290 ${WX-20},290" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    s += `<circle r="2" fill="#58a6ff"><animateMotion dur="3s" repeatCount="indefinite" path="M65,195 Q300,195 300,280 Q300,290 ${WX-20},290"/></circle>`;
    s += `<text x="300" y="${H-25}" fill="#58a6ff" font-size="9" font-family="var(--font-mono)" text-anchor="middle">→ Fujairah</text>`;
  }
  if (isShips) {
    s += `<line x1="${SX+30}" y1="130" x2="${WX-30}" y2="130" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6"/>`;
    s += `<line x1="${WX-30}" y1="160" x2="${SX+30}" y2="160" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6"/>`;
    s += `<text x="${(SX+WX)/2}" y="122" fill="#d29922" font-size="9" font-family="var(--font-mono)" text-anchor="middle" opacity="0.8">outbound ships →</text>`;
    s += `<text x="${(SX+WX)/2}" y="176" fill="#d29922" font-size="9" font-family="var(--font-mono)" text-anchor="middle" opacity="0.8">← inbound (empty)</text>`;
  }
  s += `<rect x="${800-170}" y="8" width="160" height="${isShips?85:60}" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>`;
  s += `<text x="${800-160}" y="24" fill="rgba(255,255,255,0.4)" font-size="9" font-family="var(--font-mono)">LEGEND</text>`;
  s += `<line x1="${800-160}" y1="28" x2="${800-18}" y2="28" stroke="rgba(255,255,255,0.08)"/>`;
  s += `<circle cx="${800-150}" cy="40" r="3" fill="var(--accent)"/>`;
  s += `<text x="${800-142}" y="43" fill="rgba(255,255,255,0.4)" font-size="9" font-family="var(--font-mono)">counted by this figure</text>`;
  s += `<circle cx="${800-150}" cy="56" r="3" fill="#d29922"/>`;
  s += `<text x="${800-142}" y="59" fill="rgba(255,255,255,0.4)" font-size="9" font-family="var(--font-mono)">in total — not separable</text>`;
  if (isShips) { s += `<text x="${800-150}" y="76" font-size="12" fill="#d29922">🚢</text>`; s += `<text x="${800-135}" y="78" fill="rgba(255,255,255,0.4)" font-size="9" font-family="var(--font-mono)">ship count</text>`; }
  s += `<text x="400" y="${H-4}" fill="rgba(255,255,255,0.2)" font-size="9" font-family="var(--font-mono)" text-anchor="middle">lines show connections, not amounts</text>`;
  s += `</svg>`;
  $('l1-schematic').innerHTML = s;
}

function onDateChange() {
  renderHeader();
  renderL1();
}

function onGradeChange() {
  renderL1();
}

function onPageInit() {
  renderL1();
}
</script>

</body>
</html>
